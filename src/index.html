  <style>
    :root{--bg:#07101f;--surface:#0d1729;--surface2:#121f35;--text:#f6f8fc;--muted:#a6b1c5;--line:rgba(255,255,255,.1);--primary:#6ee7d8;--accent:#8ba8ff;--shadow:0 24px 70px rgba(0,0,0,.28);--radius:22px;--max:1160px}
    *{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;scroll-padding-top:90px}body{min-width:320px;background:radial-gradient(circle at 82% 8%,rgba(139,168,255,.12),transparent 32rem),radial-gradient(circle at 8% 32%,rgba(110,231,216,.08),transparent 28rem),var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;line-height:1.65;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.17;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,#000,transparent 76%)}a{color:inherit}img{display:block;max-width:100%}.container{width:min(calc(100% - 40px),var(--max));margin-inline:auto}.skip{position:fixed;top:12px;left:12px;z-index:1000;transform:translateY(-160%);padding:10px 16px;border-radius:10px;background:var(--primary);color:#07101f;font-weight:700;text-decoration:none}.skip:focus{transform:none}
    header{position:fixed;inset:0 0 auto;z-index:100;border-bottom:1px solid transparent;transition:.25s}header.scrolled{border-color:var(--line);background:rgba(7,16,31,.88);backdrop-filter:blur(18px)}nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand,h1,h2,h3{font-family:"Space Grotesk",sans-serif}.brand{font-size:1.08rem;font-weight:700;text-decoration:none}.brand span,.kicker,.company{color:var(--primary)}.nav-links{display:flex;align-items:center;gap:8px;list-style:none}.nav-links a{display:inline-flex;padding:9px 12px;border-radius:10px;color:var(--muted);font-size:.91rem;font-weight:600;text-decoration:none;transition:.2s}.nav-links a:hover,.nav-links a:focus-visible{background:rgba(255,255,255,.06);color:var(--text)}.nav-links .nav-cta{margin-left:5px;background:var(--primary);color:#06101e}.menu{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font-size:1.2rem;cursor:pointer}
    .hero{min-height:min(100vh,820px);display:grid;align-items:center;padding:110px 0 58px}.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(250px,.5fr);align-items:center;gap:clamp(44px,6vw,80px)}.eyebrow{display:inline-flex;align-items:center;gap:9px;margin-bottom:18px;color:var(--primary);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 6px rgba(110,231,216,.1)}h1,h2,h3{line-height:1.1;letter-spacing:-.035em}h1{max-width:660px;font-size:clamp(3.5rem,5.4vw,5.3rem);line-height:.92}h1 span{display:block;color:var(--primary)}.hero-role{margin-top:20px;font-size:clamp(1.05rem,1.65vw,1.3rem);font-weight:600}.hero-copy{max-width:610px;margin-top:14px;color:var(--muted);font-size:1rem}.buttons,.contact-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.button{display:inline-flex;min-height:46px;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);color:var(--text);font-weight:700;text-decoration:none;transition:.2s}.button:hover,.button:focus-visible{transform:translateY(-2px);border-color:rgba(110,231,216,.4);background:rgba(255,255,255,.08)}.button.primary{border-color:var(--primary);background:var(--primary);color:#06101e}.facts{display:flex;flex-wrap:wrap;gap:16px 30px;margin-top:30px}.fact strong{display:block;font-family:"Space Grotesk",sans-serif;font-size:1.45rem}.fact span{color:var(--muted);font-size:.8rem}.portrait-shell{position:relative;width:min(100%,310px);margin-inline:auto}.portrait-shell:before{content:"";position:absolute;inset:-9px 12px 12px -9px;z-index:-1;border:1px solid rgba(110,231,216,.42);border-radius:25px}.portrait{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,var(--surface2),var(--surface));box-shadow:var(--shadow)}.portrait img{display:block;width:100%;height:auto;object-fit:contain}.portrait figcaption{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 17px}.portrait figcaption strong{display:block;font-family:"Space Grotesk",sans-serif;font-size:.9rem}.portrait figcaption span{color:var(--muted);font-size:.74rem}.status{width:11px;height:11px;flex:0 0 auto;border:2px solid var(--surface);border-radius:50%;background:#61e79d;box-shadow:0 0 0 5px rgba(97,231,157,.1)}
    section{padding:100px 0}.heading{display:grid;grid-template-columns:.75fr 1.25fr;gap:50px;margin-bottom:48px}.kicker{color:var(--primary);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h2{margin-top:11px;font-size:clamp(2.25rem,5vw,4.5rem)}.intro{align-self:end;max-width:610px;color:var(--muted);font-size:1.04rem}.panel{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,rgba(18,31,53,.78),rgba(13,23,41,.7))}.about-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}.about-copy{padding:clamp(28px,5vw,48px)}.about-copy p{color:var(--muted);font-size:1.03rem}.about-copy p+p{margin-top:18px}.about-copy strong{color:var(--text)}.highlights{overflow:hidden}.highlight{padding:24px 28px;border-bottom:1px solid var(--line)}.highlight:last-child{border:0}.highlight strong{display:block;color:var(--primary);font-family:"Space Grotesk",sans-serif;font-size:1.45rem}.highlight span{color:var(--muted);font-size:.9rem}
    .skill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.skill{padding:26px;transition:.2s}.skill:hover,.project:hover{transform:translateY(-4px);border-color:rgba(110,231,216,.28)}.index{color:var(--primary);font-family:"Space Grotesk",sans-serif;font-size:.75rem;font-weight:700}.skill h3{margin:14px 0 16px;font-size:1.15rem}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(255,255,255,.025);font-size:.78rem}
    .timeline{position:relative;display:grid;gap:20px;padding-left:34px}.timeline:before{content:"";position:absolute;top:8px;bottom:8px;left:7px;width:1px;background:linear-gradient(var(--primary),rgba(110,231,216,.05))}.job{position:relative;padding:clamp(25px,5vw,38px)}.job:before{content:"";position:absolute;top:31px;left:-34px;width:13px;height:13px;border:3px solid var(--bg);border-radius:50%;background:var(--primary)}.job-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.job h3{font-size:1.35rem}.company{margin-top:5px;font-weight:600}.date{flex:0 0 auto;padding:6px 10px;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:.8rem}.job ul{display:grid;gap:10px;margin:24px 0 0 18px;color:var(--muted)}li::marker{color:var(--primary)}
    .projects{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.project{position:relative;display:flex;min-height:330px;flex-direction:column;overflow:hidden;padding:clamp(27px,5vw,40px);transition:.25s}.project-wide{grid-column:1/-1;min-height:280px}.project:after{content:"";position:absolute;right:-50px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:var(--project-color,var(--primary));filter:blur(80px);opacity:.16}.project-top{display:flex;align-items:center;justify-content:space-between;gap:18px}.project-link{color:var(--muted);font-size:.84rem;font-weight:700;text-decoration:none}.project-link:hover{color:var(--primary)}.project-status{border:1px solid rgba(215,164,111,.38);border-radius:999px;background:rgba(215,164,111,.1);color:#f3c988;padding:5px 10px;font-size:.76rem;font-weight:700}.project h3{margin-top:34px;font-size:clamp(1.6rem,3vw,2.25rem)}.project-type{margin-top:7px;color:var(--accent);font-size:.86rem;font-weight:700}.project p{margin-top:18px;color:var(--muted)}.project .tags{margin-top:auto;padding-top:28px}
    .education{display:grid;grid-template-columns:1.15fr .85fr;gap:24px}.list{padding:clamp(28px,5vw,42px)}.item+.item{margin-top:26px;padding-top:26px;border-top:1px solid var(--line)}.item h3{font-size:1.08rem}.item p{margin-top:5px;color:var(--muted);font-size:.91rem}.meta{margin-top:7px;color:var(--primary);font-size:.8rem;font-weight:700}.contact{position:relative;overflow:hidden;padding:clamp(34px,7vw,78px);background:linear-gradient(120deg,rgba(110,231,216,.1),transparent 50%),var(--surface)}.contact:after{content:"SS";position:absolute;right:-10px;bottom:-78px;color:rgba(255,255,255,.025);font-family:"Space Grotesk",sans-serif;font-size:clamp(9rem,24vw,20rem);font-weight:700;line-height:1;pointer-events:none}.contact h2{max-width:790px}.contact>p:not(.kicker){max-width:650px;margin-top:20px;color:var(--muted);font-size:1.05rem}.contact-links{position:relative;z-index:1}.footer{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0 42px;border-top:1px solid var(--line);color:var(--muted);font-size:.84rem}.footer a{color:var(--text);text-decoration:none}.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}.reveal.visible{opacity:1;transform:none}:focus-visible{outline:3px solid rgba(110,231,216,.5);outline-offset:3px}
    @media(max-width:900px){.hero-grid,.heading,.about-grid,.education{grid-template-columns:1fr}.hero-grid{gap:48px}.portrait-shell{width:min(72vw,310px)}.heading{gap:18px}.skill-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:720px){.container{width:min(calc(100% - 28px),var(--max))}.menu{display:grid;place-items:center}.nav-links{position:absolute;top:68px;right:14px;left:14px;display:none;align-items:stretch;flex-direction:column;padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(7,16,31,.98);box-shadow:var(--shadow)}.nav-links.open{display:flex}.nav-links a{padding:12px}.nav-links .nav-cta{margin-left:0}.hero{min-height:auto;padding:110px 0 64px}h1{font-size:clamp(3.15rem,16vw,4.5rem)}.hero-role{font-size:1.02rem}.hero-copy{font-size:.96rem}.facts{margin-top:30px}.portrait-shell{width:min(82vw,300px)}section{padding:76px 0}.skill-grid,.projects{grid-template-columns:1fr}.project-wide{grid-column:auto}.job-top,.footer{align-items:flex-start;flex-direction:column}.project{min-height:310px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}.reveal{opacity:1;transform:none}}
  </style>
